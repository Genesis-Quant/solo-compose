name: solo

x-mirror-environment: &mirror-environment
  PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
  UV_DEFAULT_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
  UV_PYTHON_INSTALL_MIRROR: https://mirror.nju.edu.cn/github-release/astral-sh/python-build-standalone
  npm_config_registry: https://mirrors.cloud.tencent.com/npm/

x-gitee-environment: &gitee-environment
  GITEE_TOKEN: ${GITEE_TOKEN:-}
  GITEE_USERNAME: ${GITEE_USERNAME:-}
  GIT_TERMINAL_PROMPT: "0"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: credential.https://gitee.com.helper
  GIT_CONFIG_VALUE_0: >-
    !f() { if test "$$1" = get && test -n "$$GITEE_TOKEN"; then printf 'username=%s\npassword=%s\n' "$$GITEE_USERNAME" "$$GITEE_TOKEN"; fi; }; f

x-dolphinscheduler-environment: &dolphinscheduler-environment
  DATABASE: postgresql
  SPRING_PROFILES_ACTIVE: postgresql
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:${PGSQL_PORT:-5432}/${DOLPHINSCHEDULER_DATABASE:-solo_ds}
  SPRING_DATASOURCE_USERNAME: ${PGSQL_USER:?Set PGSQL_USER in .env}
  SPRING_DATASOURCE_PASSWORD: ${PGSQL_PASSWORD:?Set PGSQL_PASSWORD in .env}

x-research-environment: &research-environment
  TUSHARE_TOKEN: ${TUSHARE_TOKEN:?Set TUSHARE_TOKEN in .env}
  SOLO_DOLPHIN_HOST: ${SOLO_DOLPHIN_HOST:-dolphindb}
  SOLO_DOLPHIN_PORT: ${SOLO_DOLPHIN_PORT:-8848}
  SOLO_DOLPHIN_USERNAME: ${SOLO_DOLPHIN_USERNAME:?Set SOLO_DOLPHIN_USERNAME in .env}
  SOLO_DOLPHIN_PASSWORD: ${SOLO_DOLPHIN_PASSWORD:?Set SOLO_DOLPHIN_PASSWORD in .env}
  BACKTEST_DOLPHIN_HOST: ${BACKTEST_DOLPHIN_HOST:-dolphindb}
  BACKTEST_DOLPHIN_PORT: ${BACKTEST_DOLPHIN_PORT:-8848}
  BACKTEST_DOLPHIN_USERNAME: ${BACKTEST_DOLPHIN_USERNAME:?Set BACKTEST_DOLPHIN_USERNAME in .env}
  BACKTEST_DOLPHIN_PASSWORD: ${BACKTEST_DOLPHIN_PASSWORD:?Set BACKTEST_DOLPHIN_PASSWORD in .env}

services:
  dolphinscheduler-schema-initializer:
    image: apache/dolphinscheduler-tools:3.2.2
    environment:
      <<: [*dolphinscheduler-environment, *mirror-environment]
      TZ: Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["tools/bin/upgrade-schema.sh"]
    restart: "no"
    networks:
      - default${SOLO_DOCKER_NETWORK:+_external}

  dolphinscheduler-standalone:
    image: solo/dolphinscheduler-standalone:3.2.2-runtime-1.1.0
    build:
      context: .
      args: *mirror-environment
      dockerfile: Dockerfile.scheduler
    environment:
      <<: [*dolphinscheduler-environment, *gitee-environment, *research-environment, *mirror-environment]
      TZ: Asia/Shanghai
      MYBATISPLUS_CONFIGURATION_DATABASEID: PostgreSQL
      SPRING_JACKSON_TIME_ZONE: UTC
      API_PYTHON_GATEWAY_ENABLED: "true"
      SOLO_BACKEND_URL: http://backend:8000
      UV_LINK_MODE: hardlink
      API_PYTHON_GATEWAY_AUTH_TOKEN: ${DOLPHINSCHEDULER_PYTHON_GATEWAY_TOKEN:?Set DolphinScheduler gateway token in .env}
      MASTER_SERVER_LOAD_PROTECTION_ENABLED: "false"
      WORKER_SERVER_LOAD_PROTECTION_ENABLED: "false"
      WORKER_TENANT_CONFIG_DEFAULT_TENANT_ENABLED: "true"
      WORKER_WORKERADDRESS: dolphinscheduler-standalone:1234
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${DOLPHINSCHEDULER_API_PORT:-12346}:12345"
      - "127.0.0.1:${DOLPHINSCHEDULER_GATEWAY_PORT:-25334}:25333"
    volumes:
      - type: volume
        source: jupyter-home
        target: /runs
        volume:
          subpath: runs
          nocopy: true
      - dolphinscheduler-logs:/opt/dolphinscheduler/logs
    depends_on:
      dolphinscheduler-schema-initializer:
        condition: service_completed_successfully
      jupyter:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import pathlib
          import urllib.request
          urllib.request.urlopen('http://127.0.0.1:12345/dolphinscheduler/actuator/health', timeout=2).close()
          sockets = [row.split() for table in ('tcp', 'tcp6') for row in pathlib.Path('/proc/net/' + table).read_text().splitlines()[1:]]
          assert any(int(row[1].rsplit(':', 1)[1], 16) == 25333 and row[3] == '0A' for row in sockets), 'Python Gateway port 25333 is not listening'
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    networks:
      - default${SOLO_DOCKER_NETWORK:+_external}

  backend:
    image: solo/backend:0.1.1
    build:
      context: .
      args: *mirror-environment
      dockerfile: Dockerfile.backend
    user: root
    environment:
      <<: [*gitee-environment, *mirror-environment]
      TZ: Asia/Shanghai
      PGSQL_HOST: host.docker.internal
      PGSQL_PORT: ${PGSQL_PORT:-5432}
      PGSQL_USER: ${PGSQL_USER:?Set PGSQL_USER in .env}
      PGSQL_PASSWORD: ${PGSQL_PASSWORD:?Set PGSQL_PASSWORD in .env}
      SOLO_DATABASE: ${SOLO_DATABASE:-solo}
      DOLPHINSCHEDULER_DATABASE: ${DOLPHINSCHEDULER_DATABASE:-solo_ds}
      DOLPHINSCHEDULER_ENABLED: "true"
      DOLPHINSCHEDULER_HOST: dolphinscheduler-standalone
      DOLPHINSCHEDULER_API_PORT: "12345"
      DOLPHINSCHEDULER_GATEWAY_PORT: "25333"
      DOLPHINSCHEDULER_USERNAME: ${DOLPHINSCHEDULER_USERNAME:-solo-scheduler}
      DOLPHINSCHEDULER_PASSWORD: ${DOLPHINSCHEDULER_PASSWORD:?Set DolphinScheduler password in .env}
      DOLPHINSCHEDULER_PYTHON_GATEWAY_TOKEN: ${DOLPHINSCHEDULER_PYTHON_GATEWAY_TOKEN:?Set DolphinScheduler gateway token in .env}
      SOLO_WEB_ORIGINS: ${SOLO_WEB_ORIGINS:-http://127.0.0.1:5174,http://localhost:5174}
      SOLO_SHARED_DIR: /data
      UV_LINK_MODE: hardlink
      JUPYTER_URL: ${JUPYTER_URL:-http://127.0.0.1:8888}
      JUPYTER_API_URL: http://jupyter:8888
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?Set JUPYTER_TOKEN in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${BACKEND_BIND_PORT:-8010}:8000"
    working_dir: /app
    command: ["sh", "-c", "umask 0002 && alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - type: volume
        source: jupyter-home
        target: /data/projects
        volume:
          subpath: projects
          nocopy: true
      - type: volume
        source: jupyter-home
        target: /data/runs
        volume:
          subpath: runs
          nocopy: true
      - type: volume
        source: jupyter-home
        target: /data/artifacts
        volume:
          subpath: artifacts
          nocopy: true
      - type: volume
        source: jupyter-home
        target: /data/kernels
        volume:
          subpath: .jupyter/kernels
          nocopy: true
    depends_on:
      jupyter:
        condition: service_healthy
      dolphinscheduler-standalone:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks:
      - default${SOLO_DOCKER_NETWORK:+_external}

  frontend:
    image: solo/frontend:0.1.0
    build:
      context: .
      args: *mirror-environment
      dockerfile: Dockerfile.frontend
    environment:
      <<: *mirror-environment
      TZ: Asia/Shanghai
      SOLO_BACKEND_URL: http://backend:8000
      SOLO_JUPYTER_API_URL: http://jupyter:8888
      SOLO_JUPYTER_BROWSER_URL: ${JUPYTER_URL:-http://127.0.0.1:8888}
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_BIND_PORT:-5174}:5174"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5174').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks:
      - default${SOLO_DOCKER_NETWORK:+_external}

  jupyter:
    image: solo/jupyter:0.2.0
    build:
      context: .
      args: *mirror-environment
      dockerfile: Dockerfile.jupyter
    user: root
    working_dir: /home/jovyan
    environment:
      <<: [*gitee-environment, *research-environment, *mirror-environment]
      TZ: Asia/Shanghai
      UV_LINK_MODE: hardlink
      HOME: /home/jovyan
      SOLO_SHARED_DIR: /home/jovyan
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?Set JUPYTER_TOKEN in .env}
    ports:
      - "${JUPYTER_BIND_IP:-127.0.0.1}:${JUPYTER_BIND_PORT:-8888}:8888"
    volumes:
      - type: volume
        source: jupyter-home
        target: /home/jovyan
        volume:
          nocopy: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/login', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - default${SOLO_DOCKER_NETWORK:+_external}

volumes:
  jupyter-home:
  dolphinscheduler-logs:

networks:
  default: {}
  default_external:
    external: true
    name: ${SOLO_DOCKER_NETWORK:-}
