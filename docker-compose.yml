name: solo

services:
  backend:
    image: solo/backend:0.1.0
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      PGSQL_HOST: host.docker.internal
      PGSQL_PORT: "5432"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${BACKEND_BIND_PORT:-8010}:8000"
    working_dir: /workspace/backend
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /workspace/backend"]
    volumes:
      - ./backend:/workspace/backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  frontend:
    image: solo/frontend:0.1.0
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      SOLO_BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_BIND_PORT:-5174}:5174"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
